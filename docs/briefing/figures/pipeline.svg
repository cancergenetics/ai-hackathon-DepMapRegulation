   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="20.88" y="35.957812" transform="rotate(-0 20.88 35.957812)">Inputs</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(20.88 58.105906)">DepMap 26Q3</text>
    <text style="font-size: 8.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(20.88 68.125377)">1,436 cell lines</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(20.88 93.66375)">• gene copy number (WGS)</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(20.88 103.209563)">• mRNA, log2(TPM+1)</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(20.88 112.62375)">• covariates: lineage,</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(20.88 122.169563)">  ploidy/WGD, MSI, TP53,</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(20.88 131.58375)">  sex, media, RNA batch</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="200.16" y="37.0485" transform="rotate(-0 200.16 37.0485)">Trans association</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.4px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(175.68 62.274937)">for every pair A→B on</text>
    <text style="font-size: 8.4px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(175.68 72.159834)">different chromosomes</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(175.68 96.470953)">B's mRNA ~ A's CN, adjusted</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(175.68 105.767463)">for B's own CN, arm CN of all</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(175.68 115.101375)">other chromosomes (A's own</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(175.68 124.527865)">chromosome left out) and</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(175.68 133.824375)">covariates → t-statistic</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="369.36" y="37.044" transform="rotate(-0 369.36 37.044)">Cis-instrument gate</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.4px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(344.88 62.274937)">keep regulator A only if</text>
    <text style="font-size: 8.4px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(344.88 72.159834)">its own mRNA follows its CN</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(344.88 96.470953)">first-stage F ≥ 100</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(344.88 105.897443)">(positive cis t ≥ 10); other</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(344.88 115.225615)">regulators get weight 0</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="534.96" y="37.044" transform="rotate(-0 534.96 37.044)">Co-segment credit</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.4px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(510.48 62.172562)">neighbouring genes share</text>
    <text style="font-size: 8.4px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(510.48 72.057459)">the same CN; share credit</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(510.48 96.470953)">SuSiE L=1 posterior within</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(510.48 105.804865)">each co-segment (r ≥ 0.95),</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(510.48 115.231355)">prior ∝ exp(t_cis / 2)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="676.08" y="36.079688" transform="rotate(-0 676.08 36.079688)">Output</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(676.08 57.995719)">ranked, signed trans</text>
    <text style="font-size: 8.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(676.08 68.11597)">predictions</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(676.08 93.494672)">score = t × gate × credit</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(676.08 102.791182)">sign → predicted direction</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(676.08 112.087692)">after knockdown</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(676.08 121.573247)">≈2.2×10⁸ pairs in ~67 s</text>
    <text style="font-size: 7.9px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(676.08 130.907159)">(laptop CPU)</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(703.44 205.126125)">Optional</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(703.44 214.4214)">context layer</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(703.44 237.279938)">re-rank by how</text>
    <text style="font-size: 7.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(703.44 245.951419)">detectable target B</text>
    <text style="font-size: 7.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(703.44 254.6229)">is in the context line</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="20.88" y="313.7085" transform="rotate(-0 20.88 313.7085)">Evaluation against CRISPRi Perturb-seq</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(20.88 334.14875)">Arc Institute PIE X-Atlas/Orion DE tables; HCT116 primary, HEK293T secondary</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(20.88 343.98575)">positive pair = knocking down A changes B's mRNA (BH p_adj &lt; 0.05)</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(20.88 353.82275)">held out: regulators on 14 whole chromosome arms, labels sealed before tuning</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(370.8 334.14375)">odds ratio of hits among the top 0.1% of pairs</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(370.8 343.98075)">(regulator-label permutation p, arm-jackknife CI)</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans'; fill: #52514e" transform="translate(370.8 353.68125)">sign concordance: predicted vs observed direction</text>
   </g>
