# Pre-registered variants (DESIGN v3.1 §5.5), baselines and controls (§7), sensitivity analyses.
# Hash-locked at freeze (results/FROZEN.sha256). Do not edit after freeze without a decision note.
#
# Composition: `scripts/run_model.py --variant a+b+c` starts from `defaults` and applies the `params`
# of a, b, c in order (later ids override earlier ones). Greedy tuning (§5.5) composes the current best
# configuration with one option of the next tier, e.g. `--variant focal+g1_t30_w0`.
# Cap (§5.5): at most 30 configurations evaluated on TRAIN in total.
version: 1
design: "DESIGN.md v3.1 (frozen) §5.5, §7"
cap_train_configurations: 30
seeds: [20261027, 1, 2, 3, 4]

defaults:            # = M1: LOCO, log2 clip(2^-2, 2^3), linear dosage, no gates, no attribution
  arm_handling: loco
  n_pcs: 20
  cn_floor: 0.25
  cn_cap: 8.0
  rint: false
  dosage: linear
  g1_tau: null
  g1_w: 0.0
  g2_threshold: null
  g2_w: 0.0
  context: HCT116
  a3_rho: null
  a3_s: 2.0
  a3_wco: 0.0
  a3_sigma0: 0.05
  target_std: false
  nc1_index: null
  sample_set: S2

variants:
  - {id: M1, kind: model, tier: 0, params: {}}
  # tier 1: arm handling
  - {id: focal, kind: model, tier: 1, params: {arm_handling: focal}}
  - {id: loao, kind: model, tier: 1, params: {arm_handling: loao}}
  - {id: cnpcs20, kind: model, tier: 1, params: {arm_handling: pcs, n_pcs: 20}}
  # tier 2: G1 instrument gate, tau x w
  - {id: g1_t10_w0, kind: model, tier: 2, params: {g1_tau: 10, g1_w: 0.0}}
  - {id: g1_t10_w05, kind: model, tier: 2, params: {g1_tau: 10, g1_w: 0.5}}
  - {id: g1_t30_w0, kind: model, tier: 2, params: {g1_tau: 30, g1_w: 0.0}}
  - {id: g1_t30_w05, kind: model, tier: 2, params: {g1_tau: 30, g1_w: 0.5}}
  - {id: g1_t100_w0, kind: model, tier: 2, params: {g1_tau: 100, g1_w: 0.0}}
  - {id: g1_t100_w05, kind: model, tier: 2, params: {g1_tau: 100, g1_w: 0.5}}
  # tier 3: G2 context-expression gate (DepMap HCT116 = ACH-000971), threshold x w
  - {id: g2_thr1_w0, kind: model, tier: 3, params: {g2_threshold: 1.0, g2_w: 0.0}}
  - {id: g2_thr1_w05, kind: model, tier: 3, params: {g2_threshold: 1.0, g2_w: 0.5}}
  - {id: g2_thr2_w0, kind: model, tier: 3, params: {g2_threshold: 2.0, g2_w: 0.0}}
  - {id: g2_thr2_w05, kind: model, tier: 3, params: {g2_threshold: 2.0, g2_w: 0.5}}
  # tier 4: A3 attribution, one-at-a-time sweep from (rho 0.95, s 2, w_co 0)
  - {id: a3_r095_s2_w0, kind: model, tier: 4, params: {a3_rho: 0.95, a3_s: 2.0, a3_wco: 0.0}}
  - {id: a3_r098_s2_w0, kind: model, tier: 4, params: {a3_rho: 0.98, a3_s: 2.0, a3_wco: 0.0}}
  - {id: a3_r095_s5_w0, kind: model, tier: 4, params: {a3_rho: 0.95, a3_s: 5.0, a3_wco: 0.0}}
  - {id: a3_r095_s2_w025, kind: model, tier: 4, params: {a3_rho: 0.95, a3_s: 2.0, a3_wco: 0.25}}
  - {id: a3_r095_s2_w05, kind: model, tier: 4, params: {a3_rho: 0.95, a3_s: 2.0, a3_wco: 0.5}}
  # tier 5: target standardisation
  - {id: tstd, kind: model, tier: 5, params: {target_std: true}}
  # tier 6: dosage shape (hinge at log2 relCN = 0; loss slope ranked, gain slope stored as t_gain)
  - {id: hinge, kind: model, tier: 6, params: {dosage: hinge}}
  # tier 7: transforms
  - {id: floor5, kind: model, tier: 7, params: {cn_floor: 0.03125}}
  - {id: rint, kind: model, tier: 7, params: {rint: true}}

baselines:           # same score-file shape; DESIGN §7
  - {id: B0, kind: baseline, desc: "random scores (seeded; --seed, default 20261027)"}
  - {id: B1, kind: baseline, desc: "naive Pearson r(x_A, y_B), no covariates (stored as t, df = n-2)"}
  - {id: B2, kind: baseline, desc: "co-expression r(y_A, y_B), no CN; CN-only regulators NaN (minimum); s_cis = +1"}
  - {id: B3, kind: baseline, desc: "regulator hub: M1 cis t_A x SD(x_A), target-agnostic"}
  - {id: B4, kind: baseline, desc: "target hub: SD(y_B) across the panel"}
  - {id: B4e, kind: baseline, desc: "target detectability: y_B in DepMap HCT116 (ACH-000971)"}
  - {id: B5, kind: baseline, desc: "rank(|B3|) x rank(B4e)"}
  - {id: B6, kind: baseline, desc: "arm-only: t of arm CN of A's arm on y_B, adjusted as M1"}

controls:
  - {id: NC1, kind: model, params: {nc1_index: 0}, desc: "residual permutation of X~ within lineage strata; --perm-index k uses SeedSequence(20261027).spawn(k+1)[k]"}

sensitivity:         # not tuned; reported on TRAIN and in the final run (§5.5)
  - {id: S1, kind: model, params: {sample_set: S1}, implemented: true}
  - {id: noHCT116, kind: model, params: {sample_set: S2_noHCT116}, implemented: true}
  - {id: hidden_factors, kind: model, params: {hidden_factors: 10}, implemented: true, desc: "D8: k=10 regulator-conditional expression factors per regulator chromosome c (Y residualised on D_c and chr-c segment CN), added to D_c"}
  - {id: paralog_exclusion, implemented: false, note: "evaluation-side filter"}
  - {id: cn_outlier_exclusion, kind: model, params: {sample_set: S2_noCNoutlier}, implemented: true, desc: "D8: drop the top 1% of lines by genome-wide max |log2 max(relCN, 2^-2)|"}
  - {id: tp53_chr17_drop, kind: model, params: {tp53_chr17_drop: true}, implemented: true, desc: "D8: TP53 covariate (+ missing indicator) dropped for chr17 regulators only"}

# Post-hoc tier (PI decision D6, reviews/ideas/M5a_ideas.md §2). Added AFTER the M5a TRAIN results; label-free,
# DepMap-internal; composed on the incumbent, e.g. --variant g1_t100_w0+a3_r095_s2_w0+i5_comp.
posthoc_D6:
  - {id: i5_comp, kind: model, params: {comp_renorm: true}, desc: "I5 LOCO compositional TPM renormalisation of y (targets, cis, B6)"}
  - {id: i4_r090, kind: model, params: {a3_rho: 0.90}, desc: "I4 A3 segmentation rho 0.90"}
  - {id: i3_ivshrink, kind: model, params: {score_base: iv_shrink}, desc: "I3 shrunk IV effect r_AB sd_B/(r_cis sd_yA) * max(0, 1-4/t^2)"}
  - {id: i6_linrep, kind: model, params: {score_base: t_rep}, desc: "I6 lineage-half replicated t (results/split/lineage_halves.tsv)"}
  - {id: i1_fuse_g1, kind: model, params: {fuse_gamma: 1.0}, desc: "I1 S = sign(t) rho_P rho_T^1 (HCT116 target-expression percentile)"}
  - {id: i1_fuse_g2, kind: model, params: {fuse_gamma: 2.0}, desc: "I1 S = sign(t) rho_P rho_T^2"}
  - {id: i2_regctx, kind: model, params: {regctx: true}, desc: "I2 S <- S * rho_R(A) (HCT116 regulator-expression percentile; CN-only 0)"}

controls_D6:         # evaluation-only controls for I1 (C1 is harness-side)
  - {id: C2_g1, kind: model, params: {nc1_index: 0, g1_tau: 100, g1_w: 0.0, a3_rho: null, fuse_gamma: 1.0}, desc: "C2: I1 fusion (gamma 1) on the NC1 index-0 t, G1 kept, alpha = 1"}
  - {id: C2_g2, kind: model, params: {nc1_index: 0, g1_tau: 100, g1_w: 0.0, a3_rho: null, fuse_gamma: 2.0}, desc: "C2: I1 fusion (gamma 2) on the NC1 index-0 t, G1 kept, alpha = 1"}
