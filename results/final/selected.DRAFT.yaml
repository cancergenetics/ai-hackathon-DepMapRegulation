  - [g1_t100_w0__a3_r095_s2_w0__i1_fuse_g2, C2_g2]
  - [g1_t100_w0__a3_r095_s2_w0__i1_fuse_g2, g1_t100_w0__a3_r095_s2_w0]

lines: [hct116, hek293t]
