  - g1_t100_w0__a3_r095_s2_w0__noHCT116
  - g1_t100_w0__a3_r095_s2_w0__hidden_factors
  - g1_t100_w0__a3_r095_s2_w0__cn_outlier_exclusion
  - g1_t100_w0__a3_r095_s2_w0__tp53_chr17_drop

subsets:                                     # strings apply to subset_runs; no_split_sibling is automatic
  - paralog_exclusion
  - class_i
