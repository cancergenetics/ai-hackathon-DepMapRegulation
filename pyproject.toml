[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "depmaptr"
version = "0.1.0"
description = "DepMap copy-number -> trans-expression effects, with a Perturb-seq benchmark harness"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
